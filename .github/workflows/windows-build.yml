name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    # Tag pushes skip the path filter (GitHub does not evaluate paths for tags)
    # and publish a GitHub release. Only strict vX.Y.Z tags are accepted here;
    # the build job validates the tag against the application VERSION as well.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - '.github/workflows/windows-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'LICENSE'
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 / Python 3.11
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $Tag = '${{ github.ref_name }}'
          if ($Tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$Tag' must match vX.Y.Z"
          }
          $VersionMatch = Select-String -Path 'src/AoE4_Overlay.py' -Pattern '^VERSION = "([^"]+)"$'
          if (-not $VersionMatch) {
            throw 'Could not read VERSION from src/AoE4_Overlay.py'
          }
          $AppVersion = $VersionMatch.Matches[0].Groups[1].Value
          if ("v$AppVersion" -ne $Tag) {
            throw "Release tag '$Tag' does not match src VERSION '$AppVersion'"
          }
          Write-Output "Release tag $Tag matches app VERSION $AppVersion"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Prepare diagnostics directory
        run: New-Item -ItemType Directory -Path build-win | Out-Null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install packaging tools' }

          python -m pip install -r requirements.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install dependencies' }

          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency check failed' }

          python -m pip freeze | Set-Content build-win/build-environment.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Failed to record dependencies' }
          python -m nuitka --version | Set-Content build-win/build-tool-versions.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect Nuitka' }

      - name: Run desktop tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Require GUI dependencies so a missing install cannot silently skip Qt checks.
          python -c "import appdirs, keyboard, requests, websockets, struct; from PyQt5 import QtCore, QtGui, QtWidgets; assert struct.calcsize('P') * 8 == 64"
          if ($LASTEXITCODE -ne 0) { throw 'GUI dependencies or x64 Python are missing' }

          python -m unittest discover -s tests -v 2>&1 | Tee-Object build-win/test-results.log
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }

      - name: Build standalone application
        run: |
          $BuildArgs = @(
            '-m'
            'nuitka'
            '--standalone'
            '--enable-plugin=pyqt5'
            '--include-qt-plugins=sensible,imageformats'
            '--msvc=latest'
            '--assume-yes-for-downloads'
            '--windows-console-mode=disable'
            '--windows-icon-from-ico=src/img/aoe4_sword_shield.ico'
            '--include-data-dir=src/img=img'
            '--include-data-dir=src/html=html'
            '--noinclude-data-files=html/custom.css'
            '--noinclude-data-files=html/custom.js'
            '--output-filename=AoE4_Overlay.exe'
            '--output-dir=build-win'
            '--report=build-win/compilation-report.xml'
            'src/AoE4_Overlay.py'
          )

          python @BuildArgs 2>&1 | Tee-Object build-win/nuitka-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka build failed' }

      - name: Validate and package application
        run: |
          $DistDir = 'build-win/AoE4_Overlay.dist'
          foreach ($RequiredPath in @(
            "$DistDir/AoE4_Overlay.exe"
            "$DistDir/img/aoe4_sword_shield.ico"
            "$DistDir/img/build_order"
            "$DistDir/html/overlay.html"
            "$DistDir/html/main.js"
          )) {
            if (-not (Test-Path $RequiredPath)) { throw "Missing build output: $RequiredPath" }
          }
          foreach ($Plugin in @('qwindows.dll', 'qwebp.dll')) {
            if (-not (Get-ChildItem $DistDir -Recurse -Filter $Plugin)) {
              throw "Missing Qt plugin: $Plugin"
            }
          }

          $PackageDir = 'release/AoE4_Overlay'
          New-Item -ItemType Directory -Path $PackageDir -Force | Out-Null
          Copy-Item -Path "$DistDir/*" -Destination $PackageDir -Recurse
          Copy-Item -Path LICENSE -Destination "$PackageDir/LICENSE.txt"
          Compress-Archive -Path $PackageDir -DestinationPath release/AoE4_Overlay.zip

          $Hash = (Get-FileHash release/AoE4_Overlay.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  AoE4_Overlay.zip" | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AoE4_Overlay-windows-x64
          path: |
            release/AoE4_Overlay.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-build-diagnostics
          path: |
            build-win/build-environment.txt
            build-win/build-tool-versions.txt
            build-win/test-results.log
            build-win/nuitka-build.log
            build-win/compilation-report.xml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: AoE4_Overlay-windows-x64
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "AoE4 Overlay ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            release-assets/AoE4_Overlay.zip release-assets/SHA256SUMS.txt
